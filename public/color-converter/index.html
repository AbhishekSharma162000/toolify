<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Converter — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">🎨 Color Converter</div><div class="tsub">HEX ↔ RGB ↔ HSL</div>
  <div class="card" style="max-width:460px">
    <div class="grad-prev" :style="{background:clr.hex}"></div>
    <div class="f"><label>Pick Color</label><input v-model="clr.hex" type="color" style="width:100%;height:40px;padding:3px;cursor:pointer"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px">
      <div style="background:var(--bg2);border-radius:7px;padding:9px;text-align:center;cursor:pointer;border:1px solid var(--border)" @click="cp(clr.hex)"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">HEX</div><div style="font-size:12px;font-weight:600;font-family:monospace">{{clr.hex}}</div></div>
      <div style="background:var(--bg2);border-radius:7px;padding:9px;text-align:center;cursor:pointer;border:1px solid var(--border)" @click="cp(clrRgb)"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">RGB</div><div style="font-size:11px;font-weight:600;font-family:monospace">{{clrRgb}}</div></div>
      <div style="background:var(--bg2);border-radius:7px;padding:9px;text-align:center;cursor:pointer;border:1px solid var(--border)" @click="cp(clrHsl)"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">HSL</div><div style="font-size:11px;font-weight:600;font-family:monospace">{{clrHsl}}</div></div>
    </div>
    <div style="font-size:11px;color:var(--sub);margin-top:8px;text-align:center">Click to copy</div>
  </div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const cp=_cp;
  const clr=ref({hex:'#7c6fff'});
  const h2r=h=>{const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:0,g:0,b:0};};
  const clrRgb=computed(()=>{const{r,g,b}=h2r(clr.value.hex);return`rgb(${r}, ${g}, ${b})`;});
  const clrHsl=computed(()=>{let{r,g,b}=h2r(clr.value.hex);r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h,s,l=(mx+mn)/2;if(mx===mn){h=s=0;}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return`hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;});
  return {dark,toggleTheme,cp,clr,clrRgb,clrHsl};
}}).mount('#app');
</script>
</body>
</html>
