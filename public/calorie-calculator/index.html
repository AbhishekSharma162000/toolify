<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calorie Calculator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">🔥 Calorie Calculator</div><div class="tsub">Daily calories + macro targets</div>
  <div class="ad"><script async="async" data-cfasync="false" src="https://pl28946032.effectivecpmnetwork.com/09f214e43608f0ce8be8f9c566e059d1/invoke.js"></script>
<div id="container-09f214e43608f0ce8be8f9c566e059d1"></div></div>
  <div class="cl">
    <div class="card">
      <div class="r2"><div class="f"><label>Age</label><input v-model.number="cal.age" type="number" placeholder="25"/></div><div class="f"><label>Gender</label><select v-model="cal.gender"><option value="male">Male</option><option value="female">Female</option></select></div></div>
      <div class="r2"><div class="f"><label>Weight (kg)</label><input v-model.number="cal.weight" type="number" placeholder="70"/></div><div class="f"><label>Height (cm)</label><input v-model.number="cal.height" type="number" placeholder="175"/></div></div>
      <div class="f"><label>Activity</label><select v-model="cal.activity"><option value="1.2">Sedentary</option><option value="1.375">Light</option><option value="1.55">Moderate</option><option value="1.725">Active</option><option value="1.9">Very Active</option></select></div>
      <button class="btn" @click="calcCal">Calculate</button>
    </div>
    <div v-if="cal.res" class="card">
      <div class="rg">
        <div class="rb"><div class="rl">Maintenance</div><div class="rv ac">{{cal.res.maintain}} kcal</div></div>
        <div class="rb"><div class="rl">Weight Loss</div><div class="rv gr">{{cal.res.lose}} kcal</div></div>
        <div class="rb"><div class="rl">Weight Gain</div><div class="rv re">{{cal.res.gain}} kcal</div></div>
        <div class="rb"><div class="rl">BMR</div><div class="rv">{{cal.res.bmr}} kcal</div></div>
      </div>
      <div class="macros">
        <div class="macro"><div class="mv gr">{{cal.res.protein}}g</div><div class="ml">Protein</div></div>
        <div class="macro"><div class="mv ac">{{cal.res.carbs}}g</div><div class="ml">Carbs</div></div>
        <div class="macro"><div class="mv re">{{cal.res.fat}}g</div><div class="ml">Fat</div></div>
      </div>
    </div>
  </div>
  <div class="ad"><script async="async" data-cfasync="false" src="https://pl28946032.effectivecpmnetwork.com/09f214e43608f0ce8be8f9c566e059d1/invoke.js"></script>
<div id="container-09f214e43608f0ce8be8f9c566e059d1"></div></div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;
  const cal=ref({age:25,gender:'male',weight:70,height:175,activity:'1.55',res:null});
  const calcCal=()=>{const v=cal.value,bmr=v.gender==='male'?10*v.weight+6.25*v.height-5*v.age+5:10*v.weight+6.25*v.height-5*v.age-161;const maintain=Math.round(bmr*parseFloat(v.activity));cal.value.res={bmr:Math.round(bmr),maintain,lose:maintain-500,gain:maintain+500,protein:Math.round(v.weight*2),carbs:Math.round(maintain*.45/4),fat:Math.round(maintain*.25/9)};};
  return {dark,toggleTheme,fmt,fmtS,cal,calcCal};
}}).mount('#app');
</script>
</body>
</html>
