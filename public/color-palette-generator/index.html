<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Palette Generator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">🎭 Color Palette Generator</div><div class="tsub">Generate palettes from a base color</div>
  <div class="card" style="max-width:520px">
    <div class="r2">
      <div class="f"><label>Base Color</label><input v-model="pal.base" type="color"/></div>
      <div class="f"><label>Type</label><select v-model="pal.type"><option value="mono">Monochromatic</option><option value="comp">Complementary</option><option value="ana">Analogous</option><option value="tri">Triadic</option></select></div>
    </div>
    <div class="pal-grid">
      <div v-for="c in palColors" :key="c" class="pal-sw" :style="{background:c}" @click="cp(c)">{{c}}</div>
    </div>
    <div style="font-size:11px;color:var(--sub);margin-top:8px;text-align:center">Click any swatch to copy hex</div>
  </div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const cp=_cp;
  const h2r=h=>{const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?{r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)}:{r:0,g:0,b:0};};
  const hexToHsl=hex=>{let{r,g,b}=h2r(hex);r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];};
  const hslToHex=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const color=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*color).toString(16).padStart(2,'0');};return`#${f(0)}${f(8)}${f(4)}`;};
  const pal=ref({base:'#7c6fff',type:'mono'});
  const palColors=computed(()=>{const[h,s,l]=hexToHsl(pal.value.base);if(pal.value.type==='mono')return[-20,-10,0,10,20].map(d=>hslToHex(h,s,Math.max(10,Math.min(90,l+d))));if(pal.value.type==='comp')return[0,30,60,180,210].map(d=>hslToHex((h+d)%360,s,l));if(pal.value.type==='ana')return[-30,-15,0,15,30].map(d=>hslToHex((h+d+360)%360,s,l));return[0,120,240,60,180].map(d=>hslToHex((h+d)%360,s,l));});
  return {dark,toggleTheme,cp,pal,palColors};
}}).mount('#app');
</script>
</body>
</html>
