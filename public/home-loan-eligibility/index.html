<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Loan Eligibility — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">

<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>

<div class="tp">
  <div class="ttl">🏠 Home Loan Eligibility</div><div class="tsub">Max loan you qualify for</div>
  <div class="cl">
    <div class="card">
      <div class="f"><label>Monthly Net Income (₹)</label><input v-model.number="hl.income" type="number" placeholder="80000"/></div>
      <div class="f"><label>Existing EMIs (₹/month)</label><input v-model.number="hl.existing" type="number" placeholder="0"/></div>
      <div class="f"><label>Interest Rate (%/year)</label><input v-model.number="hl.rate" type="number" step="0.1" placeholder="8.5"/></div>
      <div class="f"><label>Tenure (years)</label><input v-model.number="hl.years" type="number" placeholder="20"/></div>
      <button class="btn" @click="calcHl">Check Eligibility</button>
    </div>
    <div v-if="hl.res" class="card">
      <div class="big-res gr">₹{{fmtS(hl.res.eligible)}}</div>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">Max Eligible Loan</div>
      <div class="rg">
        <div class="rb"><div class="rl">Max EMI</div><div class="rv ac">₹{{fmt(hl.res.maxEmi)}}</div></div>
        <div class="rb"><div class="rl">EMI on Max Loan</div><div class="rv">₹{{fmt(hl.res.emi)}}</div></div>
        <div class="rb"><div class="rl">Total Interest</div><div class="rv re">₹{{fmtS(hl.res.totalInterest)}}</div></div>
        <div class="rb"><div class="rl">FOIR</div><div class="rv am">{{hl.res.foir}}%</div></div>
      </div>
    </div>
  </div>
</div>

</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;

  const hl=ref({income:80000,existing:0,rate:8.5,years:20,res:null});
  const calcHl=()=>{
    const maxEmi=Math.round((hl.value.income-hl.value.existing)*0.5);
    const r=hl.value.rate/100/12, n=hl.value.years*12;
    const eligible=Math.round(maxEmi*(Math.pow(1+r,n)-1)/r/Math.pow(1+r,n));
    const emiOnMax=Math.round(eligible*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1));
    hl.value.res={eligible,maxEmi,emi:emiOnMax,totalInterest:emiOnMax*n-eligible,foir:Math.round((emiOnMax+hl.value.existing)/hl.value.income*100)};
  };

  return {dark,toggleTheme,fmt,fmtS,hl,calcHl};
}}).mount('#app');
</script>
</body>
</html>
