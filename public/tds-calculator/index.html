<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDS Calculator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">

<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>

<div class="tp">
  <div class="ttl">📋 TDS Calculator</div><div class="tsub">Tax Deducted at Source</div>
  <div class="card" style="max-width:480px">
    <div class="f"><label>Payment Type</label>
      <select v-model="tds.type">
        <option value="salary">Salary (as per slab)</option>
        <option value="194c">Contractor 194C — 1%</option>
        <option value="194j">Professional Fees 194J — 10%</option>
        <option value="194i">Rent 194I — 10%</option>
        <option value="194a">Interest 194A — 10%</option>
      </select>
    </div>
    <div class="f"><label>Payment Amount (₹)</label><input v-model.number="tds.amount" type="number" placeholder="100000"/></div>
    <div v-if="tds.amount" class="rg" style="margin-top:12px">
      <div class="rb"><div class="rl">TDS Rate</div><div class="rv ac">{{tdsRate}}%</div></div>
      <div class="rb"><div class="rl">TDS Amount</div><div class="rv re">₹{{fmt(tdsAmt)}}</div></div>
      <div class="rb"><div class="rl">Net Amount</div><div class="rv gr">₹{{fmt(tds.amount-tdsAmt)}}</div></div>
      <div class="rb"><div class="rl">Gross Payment</div><div class="rv">₹{{fmt(tds.amount)}}</div></div>
    </div>
  </div>
</div>

</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;

  const tds=ref({type:'194j',amount:100000});
  const tdsRateMap={salary:10,'194c':1,'194j':10,'194i':10,'194a':10};
  const tdsRate=computed(()=>tdsRateMap[tds.value.type]||10);
  const tdsAmt=computed(()=>Math.round(tds.value.amount*tdsRate.value/100));

  return {dark,toggleTheme,fmt,fmtS,tds,tdsRate,tdsAmt};
}}).mount('#app');
</script>
</body>
</html>
