<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split PDF — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">✂️ Split PDF</div>
  <div class="tsub">Runs entirely in your browser — nothing uploaded</div>
  <div class="card" style="max-width:560px">
    <div class="drop" :class="split.over&&'over'" @dragover.prevent="split.over=true" @dragleave="split.over=false" @drop.prevent="e=>{split.over=false;const f=e.dataTransfer.files[0];if(f?.type==='application/pdf')split.file=f}" @click="$refs.sInp.click()">
      <div style="font-size:34px;margin-bottom:8px">📄</div>
      <div v-if="!split.file" style="font-size:14px">Drop PDF or <span style="color:var(--p)">browse</span></div>
      <div v-else style="font-size:13px;color:var(--g)">✓ {{split.file.name}}</div>
      <input ref="sInp" type="file" accept=".pdf" hidden @change="e=>split.file=e.target.files[0]"/>
    </div>
    <div v-if="split.file" style="margin-top:14px">
      <div class="r2"><div class="f"><label>From Page</label><input v-model.number="split.from" type="number" min="1" placeholder="1"/></div><div class="f"><label>To Page</label><input v-model.number="split.to" type="number" min="1" placeholder="5"/></div></div>
      <button class="btn" :disabled="split.loading" @click="splitPdf">{{split.loading?'Splitting...':'Extract Pages →'}}</button>
    </div>
    <div v-if="split.err" class="err">{{split.err}}</div>
    <div v-if="split.done" class="ok">✓ Downloaded!</div>
  </div>
</div>
</div>
<script>
const {createApp,ref} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const dlPdf=_dlPdf, fmtB=_fmtB;

  const split=ref({file:null,from:1,to:5,loading:false,err:'',done:false,over:false});
  const splitPdf=async()=>{const s=split.value;s.loading=true;s.err='';s.done=false;try{const{PDFDocument}=PDFLib,src=await PDFDocument.load(await s.file.arrayBuffer()),total=src.getPageCount(),from=Math.max(1,s.from)-1,to=Math.min(s.to||total,total),out=await PDFDocument.create();(await out.copyPages(src,Array.from({length:to-from},(_,i)=>from+i))).forEach(p=>out.addPage(p));dlPdf(await out.save(),'split.pdf');s.done=true;}catch(e){s.err='Error: '+e.message;}s.loading=false;};

  return {dark,toggleTheme,split,splitPdf};
}}).mount('#app');
</script>
</body>
</html>
