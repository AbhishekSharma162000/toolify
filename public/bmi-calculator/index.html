<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMI Calculator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">⚖️ BMI Calculator</div><div class="tsub">Body Mass Index with health indicator</div>
  <div class="ad"><script async="async" data-cfasync="false" src="https://pl28946032.effectivecpmnetwork.com/09f214e43608f0ce8be8f9c566e059d1/invoke.js"></script>
<div id="container-09f214e43608f0ce8be8f9c566e059d1"></div></div>
  <div class="card" style="max-width:440px">
    <div class="r2"><div class="f"><label>Weight (kg)</label><input v-model.number="bmi.w" type="number" placeholder="70"/></div><div class="f"><label>Height (cm)</label><input v-model.number="bmi.h" type="number" placeholder="175"/></div></div>
    <button class="btn" @click="calcBmi">Calculate</button>
    <div v-if="bmi.res" style="margin-top:20px;text-align:center">
      <div style="font-size:54px;font-weight:800;margin-bottom:5px" :style="{color:bmi.res.color}">{{bmi.res.val}}</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:14px" :style="{color:bmi.res.color}">{{bmi.res.label}}</div>
      <div class="bmi-z"><div v-for="z in bmiZones" :key="z.l" class="zm" :style="{background:z.c,flex:z.f}"><span v-if="bmi.res.label===z.l" class="zmk">▲</span></div></div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:18px"><span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span></div>
    </div>
  </div>
  <div class="ad"><script async="async" data-cfasync="false" src="https://pl28946032.effectivecpmnetwork.com/09f214e43608f0ce8be8f9c566e059d1/invoke.js"></script>
<div id="container-09f214e43608f0ce8be8f9c566e059d1"></div></div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;
  const bmi=ref({w:70,h:175,res:null});
  const bmiZones=[{l:'Underweight',c:'#3b82f6',f:1},{l:'Normal',c:'#22c55e',f:1.5},{l:'Overweight',c:'#f59e0b',f:1},{l:'Obese',c:'#ef4444',f:1.5}];
  const calcBmi=()=>{const h=bmi.value.h/100,val=(bmi.value.w/(h*h)).toFixed(1);const[,label,color]=[[18.5,'Underweight','#3b82f6'],[25,'Normal','#22c55e'],[30,'Overweight','#f59e0b'],[Infinity,'Obese','#ef4444']].find(([t])=>val<t);bmi.value.res={val,label,color};};
  return {dark,toggleTheme,fmt,fmtS,bmi,bmiZones,calcBmi};
}}).mount('#app');
</script>
</body>
</html>
