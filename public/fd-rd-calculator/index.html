<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FD / RD Calculator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">

<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>

<div class="tp">
  <div class="ttl">🏧 FD / RD Calculator</div><div class="tsub">Fixed and recurring deposit maturity</div>
  <div class="cl">
    <div class="card">
      <div class="tabs"><button :class="['tab',fd.type==='fd'&&'active']" @click="fd.type='fd'">FD</button><button :class="['tab',fd.type==='rd'&&'active']" @click="fd.type='rd'">RD</button></div>
      <div class="f"><label>Amount (₹)</label><input v-model.number="fd.amount" type="number" :placeholder="fd.type==='fd'?'100000':'5000'"/></div>
      <div class="f"><label>Annual Rate (%)</label><input v-model.number="fd.rate" type="number" step="0.1" placeholder="7"/></div>
      <div class="f"><label>Period (years)</label><input v-model.number="fd.years" type="number" placeholder="3"/></div>
      <button class="btn" @click="calcFd">Calculate</button>
    </div>
    <div v-if="fd.res" class="card">
      <div class="big-res gr">₹{{fmt(fd.res.maturity)}}</div>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">Maturity Amount</div>
      <div class="rg">
        <div class="rb"><div class="rl">Principal</div><div class="rv">₹{{fmt(fd.res.principal)}}</div></div>
        <div class="rb"><div class="rl">Interest</div><div class="rv gr">₹{{fmt(fd.res.interest)}}</div></div>
      </div>
    </div>
  </div>
</div>

</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;

  const fd=ref({type:'fd',amount:100000,rate:7,years:3,compound:4,res:null});
  const calcFd=()=>{
    let maturity,principal;
    if(fd.value.type==='fd'){
      principal=fd.value.amount;
      maturity=Math.round(fd.value.amount*Math.pow(1+fd.value.rate/100/fd.value.compound,fd.value.compound*fd.value.years));
    } else {
      principal=fd.value.amount*fd.value.years*12;
      const r=fd.value.rate/100/12, n=fd.value.years*12;
      maturity=Math.round(fd.value.amount*(Math.pow(1+r,n+1)-(1+r))/r);
    }
    fd.value.res={maturity,principal,interest:maturity-principal};
  };

  return {dark,toggleTheme,fmt,fmtS,fd,calcFd};
}}).mount('#app');
</script>
</body>
</html>
