<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip Calculator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">🍽️ Tip Calculator</div><div class="tsub">Split bill and calculate tip</div>
  <div class="ad"><script async="async" data-cfasync="false" src="https://pl28946032.effectivecpmnetwork.com/09f214e43608f0ce8be8f9c566e059d1/invoke.js"></script>
<div id="container-09f214e43608f0ce8be8f9c566e059d1"></div></div>
  <div class="card" style="max-width:440px">
    <div class="f"><label>Bill Amount (₹)</label><input v-model.number="tip.bill" type="number" placeholder="1000"/></div>
    <div class="f"><label>Tip (%)</label><input v-model.number="tip.pct" type="number" placeholder="10"/></div>
    <div class="f"><label>Split Between</label><input v-model.number="tip.split" type="number" placeholder="2" min="1"/></div>
    <div v-if="tip.bill" class="rg" style="margin-top:8px">
      <div class="rb"><div class="rl">Tip</div><div class="rv ac">₹{{fmt((tip.bill*(tip.pct||0)/100).toFixed(2))}}</div></div>
      <div class="rb"><div class="rl">Total</div><div class="rv gr">₹{{fmt((tip.bill*(1+(tip.pct||0)/100)).toFixed(2))}}</div></div>
      <div class="rb" style="grid-column:1/-1"><div class="rl">Per Person</div><div class="rv" style="font-size:24px;color:var(--p)">₹{{fmt((tip.bill*(1+(tip.pct||0)/100)/(tip.split||1)).toFixed(2))}}</div></div>
    </div>
  </div>
  <div class="ad"><script async="async" data-cfasync="false" src="https://pl28946032.effectivecpmnetwork.com/09f214e43608f0ce8be8f9c566e059d1/invoke.js"></script>
<div id="container-09f214e43608f0ce8be8f9c566e059d1"></div></div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;
  const tip=ref({bill:1000,pct:10,split:2});
  return {dark,toggleTheme,fmt,fmtS,tip};
}}).mount('#app');
</script>
</body>
</html>
