<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Converter — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">🔡 Case Converter</div><div class="tsub">Convert text to any case format</div>
  <div class="card">
    <div class="f"><label>Input</label><textarea v-model="cc.input" placeholder="Type text here..."></textarea></div>
    <div class="tabs" style="flex-wrap:wrap">
      <button v-for="m in caseModes" :key="m.k" :class="['tab',cc.mode===m.k&&'active']" @click="cc.mode=m.k">{{m.l}}</button>
    </div>
    <div v-if="cc.input">
      <div class="f"><label>Result</label><textarea readonly :value="caseResult" style="color:var(--g);min-height:70px"></textarea></div>
      <button class="btn" @click="copyCR" style="margin-top:0">{{cc.copied?'✓ Copied!':'Copy'}}</button>
    </div>
  </div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const cp=_cp;
  const cc=ref({input:'',mode:'upper',copied:false});
  const caseModes=[{k:'upper',l:'UPPER'},{k:'lower',l:'lower'},{k:'title',l:'Title'},{k:'sentence',l:'Sentence'},{k:'camel',l:'camelCase'},{k:'snake',l:'snake_case'},{k:'kebab',l:'kebab-case'}];
  const caseResult=computed(()=>{const t=cc.value.input;if(cc.value.mode==='upper')return t.toUpperCase();if(cc.value.mode==='lower')return t.toLowerCase();if(cc.value.mode==='title')return t.replace(/\b\w/g,c=>c.toUpperCase());if(cc.value.mode==='sentence')return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();if(cc.value.mode==='camel')return t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase());if(cc.value.mode==='snake')return t.toLowerCase().replace(/\s+/g,'_');return t.toLowerCase().replace(/\s+/g,'-');});
  const copyCR=()=>{cp(caseResult.value);cc.value.copied=true;setTimeout(()=>cc.value.copied=false,1500);};
  return {dark,toggleTheme,cc,caseModes,caseResult,copyCR};
}}).mount('#app');
</script>
</body>
</html>
