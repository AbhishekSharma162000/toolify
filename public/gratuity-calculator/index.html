<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gratuity Calculator — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">

<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>

<div class="tp">
  <div class="ttl">🎁 Gratuity Calculator</div><div class="tsub">As per Payment of Gratuity Act</div>
  <div class="card" style="max-width:460px">
    <div class="f"><label>Last Basic + DA (₹/month)</label><input v-model.number="grat.basic" type="number" placeholder="50000"/></div>
    <div class="f"><label>Years of Service</label><input v-model.number="grat.years" type="number" placeholder="10" step="0.5"/></div>
    <div v-if="grat.basic&&grat.years">
      <div class="big-res gr">₹{{fmt(Math.round(grat.basic*grat.years*15/26))}}</div>
      <div style="text-align:center;color:var(--muted);font-size:11px;margin-top:8px">Formula: (Basic × Years × 15) ÷ 26</div>
    </div>
  </div>
</div>

</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const fmt=_fmt, fmtS=_fmtS;

  const grat=ref({basic:50000,years:10});

  return {dark,toggleTheme,fmt,fmtS,grat};
}}).mount('#app');
</script>
</body>
</html>
