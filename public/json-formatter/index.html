<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter — Free Online Tool | Toolzyo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
#page-loader{position:fixed;inset:0;z-index:9999;background:#0f0f12;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
#page-loader.done{opacity:0;pointer-events:none}
body.light #page-loader{background:#f5f5f8}
.pl-ring{width:46px;height:46px;border:3px solid rgba(124,111,255,.18);border-top-color:#7c6fff;border-radius:50%;animation:pl-s .7s linear infinite}
@keyframes pl-s{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/js/tool-base.js"></script>
</head>
<body class="dark">
<div id="page-loader"><div class="pl-ring"></div></div>
<div id="app">
<nav class="navbar">
  <a class="logo" href="/">⚡ Toolzyo</a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/" style="font-size:13px;color:var(--sub);text-decoration:none;border:1px solid rgba(255,255,255,.12);padding:5px 14px;border-radius:8px">← Back to Tools</a>
    <button class="theme-btn" @click="toggleTheme">{{dark?'☀️ Light':'🌙 Dark'}}</button>
  </div>
</nav>
<div class="tp">
  <div class="ttl">📋 JSON Formatter</div><div class="tsub">Format, validate and minify JSON</div>
  <div class="card">
    <div class="tabs"><button :class="['tab',jf.mode==='format'&&'active']" @click="jf.mode='format'">Format</button><button :class="['tab',jf.mode==='minify'&&'active']" @click="jf.mode='minify'">Minify</button><button :class="['tab',jf.mode==='validate'&&'active']" @click="jf.mode='validate'">Validate</button></div>
    <div class="f"><label>Input JSON</label><textarea v-model="jf.input" placeholder='{"name":"John","age":30}' style="min-height:130px"></textarea></div>
    <button class="btn" @click="processJson">{{jf.mode==='format'?'Format JSON':jf.mode==='minify'?'Minify JSON':'Validate JSON'}}</button>
    <div v-if="jf.err" class="err">{{jf.err}}</div>
    <div v-if="jf.out&&!jf.err"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;margin-bottom:5px"><span style="font-size:11px;color:var(--muted)">Output</span><button class="btn-sm" @click="cp(jf.out)">Copy</button></div><div class="code-out">{{jf.out}}</div></div>
    <div v-if="jf.valid===true" class="ok">✓ Valid JSON</div>
  </div>
</div>
</div>
<script>
const {createApp,ref,computed} = Vue;
createApp({setup(){
  const {dark,toggleTheme} = _toolSetup();
  const cp=_cp;
  const jf=ref({input:'',mode:'format',out:'',err:'',valid:null});
  const processJson=()=>{jf.value.err='';jf.value.out='';jf.value.valid=null;try{const p=JSON.parse(jf.value.input);if(jf.value.mode==='format')jf.value.out=JSON.stringify(p,null,2);else if(jf.value.mode==='minify')jf.value.out=JSON.stringify(p);else jf.value.valid=true;}catch(e){jf.value.err='Invalid JSON: '+e.message;}};
  return {dark,toggleTheme,cp,jf,processJson};
}}).mount('#app');
</script>
</body>
</html>
